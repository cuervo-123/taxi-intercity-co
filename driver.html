<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>🚕 Driver GPS · Tech Blue Fleet</title>
<meta name="color-scheme" content="dark" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--bg0:#050914;--bg1:#081429;--panel:#0d1934;--line:rgba(74,195,255,.28);--text:#eaf4ff;--muted:#9db8d8;--blue:#1f8bff;--cyan:#4ac3ff;--green:#2ee59d;--red:#ff4d6d;--yellow:#ffd166}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,rgba(31,139,255,.24),transparent 35%),linear-gradient(180deg,var(--bg0),var(--bg1));min-height:100vh}.wrap{width:min(720px,100%);margin:auto;padding:16px}.hero{border:1px solid var(--line);background:linear-gradient(180deg,rgba(13,25,52,.95),rgba(9,18,39,.96));border-radius:28px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.42)}.brand{display:flex;gap:12px;align-items:center}.logo{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));font-size:28px;box-shadow:0 0 25px rgba(74,195,255,.35)}h1{margin:0;font-size:23px}.muted{color:var(--muted)}.card{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:22px;padding:14px;margin-top:13px}label{display:block;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:6px;letter-spacing:.6px}select,input{width:100%;padding:13px;border-radius:16px;border:1px solid var(--line);background:#050b1d;color:var(--text);font-size:16px}button{width:100%;padding:15px;border-radius:18px;border:1px solid rgba(74,195,255,.45);background:linear-gradient(135deg,var(--blue),var(--cyan));color:white;font-weight:950;font-size:16px;margin-top:10px;cursor:pointer}button.stop{background:linear-gradient(135deg,#ff416c,#ff4d4d)}button.secondary{background:rgba(255,255,255,.08)}.pill{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:8px;background:rgba(255,255,255,.04);color:var(--muted);font-weight:800}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--yellow)}#map{height:290px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#061126;margin-top:12px}.notice{border:1px solid rgba(255,209,102,.4);background:rgba(255,209,102,.08);color:#ffe7a3;padding:12px;border-radius:18px;margin-top:12px}.log{font-family:ui-monospace,Menlo,Consolas,monospace;background:#020817;border:1px solid var(--line);border-radius:16px;padding:10px;white-space:pre-wrap;color:#cfe7ff;font-size:12px;min-height:80px;max-height:190px;overflow:auto}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#071126;color:#eaf4ff;border:1px solid rgba(74,195,255,.35)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand"><div class="logo">🚕</div><div><h1>Driver GPS</h1><div class="muted">Tech Blue Fleet · Modo conductor</div></div></div>
    <div class="notice">Esta página solo envía ubicación. Déjala abierta mientras el conductor esté trabajando.</div>

    <div class="card">
      <label>Selecciona tu taxi</label>
      <select id="taxiSelect"><option>Cargando...</option></select>
      <label style="margin-top:12px">Código secreto del conductor</label>
      <input id="driverCode" type="password" placeholder="Código asignado por el dueño">
      <button id="btnStart">📡 Activar GPS</button>
      <button id="btnStop" class="stop">⏹️ Detener GPS</button>
      <button id="btnRefresh" class="secondary">🔄 Actualizar lista de taxis</button>
    </div>

    <div class="card">
      <label>Modo emergencia si no carga la lista</label>
      <input id="manualTaxiId" placeholder="Ejemplo: taxi-01">
      <button id="btnManual" class="secondary">🚕 Usar taxi escrito manualmente</button>
    </div>

    <div class="card">
      <label>Estado</label>
      <div class="pill"><span>JavaScript</span><b id="jsStatus" class="warn">Cargando</b></div>
      <div class="pill"><span>Supabase</span><b id="cloudStatus" class="warn">Sin probar</b></div>
      <div class="pill"><span>Taxis nube</span><b id="cloudCount">-</b></div>
      <div class="pill"><span>Taxi activo</span><b id="taxiStatus">No seleccionado</b></div>
      <div class="pill"><span>Permiso</span><b id="accessStatus" class="warn">Sin validar</b></div>
      <div class="pill"><span>GPS</span><b id="gpsStatus" class="warn">Esperando</b></div>
      <div class="pill"><span>Última señal</span><b id="lastSignal">-</b></div>
      <div class="pill"><span>Precisión</span><b id="accuracy">-</b></div>
    </div>

    <div class="card"><label>Tu ubicación actual</label><div id="map"></div></div>
    <div class="card"><label>Diagnóstico</label><div id="log" class="log">Iniciando...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  'use strict';

  const SUPABASE_URL = 'https://drbecawlairmgizftryn.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyYmVjYXdsYWlybWdpemZ0cnluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0OTcwNTQsImV4cCI6MjA5MzA3MzA1NH0.B3rV8KUY7eloKnyjwbiyok3jsp_YS9Pt0_efHOKjm88';

  let supa = null;
  let taxis = [];
  let manualTaxi = null;
  let watchId = null;
  let map = null;
  let marker = null;

  function el(id){ return document.getElementById(id); }
  function setText(id, text, cls){
    const node = el(id);
    if(!node) return;
    node.textContent = text;
    if(cls) node.className = cls;
  }
  function log(msg){
    const box = el('log');
    const time = new Date().toLocaleTimeString();
    box.textContent = '[' + time + '] ' + msg + '\n' + box.textContent;
    console.log('[DriverGPS]', msg);
  }
  function selectedTaxi(){
    if(manualTaxi) return manualTaxi;
    const id = el('taxiSelect').value;
    return taxis.find(t => String(t.id) === String(id));
  }
  function updateTaxiLabel(){
    const t = selectedTaxi();
    setText('taxiStatus', t ? ((t.name || t.id) + (t.plate ? ' · ' + t.plate : '')) : 'No seleccionado');
  }
  function initMap(){
    if(map || !window.L) return;
    map = L.map('map').setView([3.4516, -76.5320], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
    setTimeout(() => map.invalidateSize(), 300);
  }
  function updateMap(lat,lng,name){
    initMap();
    if(!map) return;
    const pos = [lat,lng];
    if(marker){ marker.setLatLng(pos).setPopupContent('<b>' + name + '</b><br>GPS activo'); }
    else { marker = L.marker(pos).addTo(map).bindPopup('<b>' + name + '</b><br>GPS activo'); }
    map.setView(pos, 16);
  }
  async function refreshTaxis(){
    try{
      manualTaxi = null;
      setText('gpsStatus','Cargando taxis...','warn');
      setText('cloudStatus','Conectando...','warn');
      log('Consultando tabla taxis en Supabase...');
      const result = await supa.from('taxis').select('*').order('name', { ascending:true });
      if(result.error){
        setText('cloudStatus','Error','bad');
        setText('gpsStatus','Error Supabase','bad');
        log('ERROR Supabase: ' + result.error.message);
        alert('No se pudo leer Supabase: ' + result.error.message);
        return;
      }
      taxis = result.data || [];
      setText('cloudStatus','Conectado','ok');
      setText('cloudCount', String(taxis.length));
      log('Taxis recibidos: ' + taxis.length);
      const select = el('taxiSelect');
      if(!taxis.length){
        select.innerHTML = '<option value="">No hay taxis en Supabase</option>';
        setText('gpsStatus','Sin taxis nube','bad');
        return;
      }
      select.innerHTML = taxis.map(t => '<option value="' + String(t.id) + '">' + (t.name || t.id) + (t.plate ? ' · ' + t.plate : '') + '</option>').join('');
      const taxiParam = new URLSearchParams(location.search).get('taxi');
      if(taxiParam && taxis.some(t => String(t.id) === String(taxiParam))) select.value = taxiParam;
      updateTaxiLabel();
      setText('gpsStatus','Listo','ok');
    }catch(err){
      setText('gpsStatus','Error JS','bad');
      log('ERROR JS refreshTaxis: ' + err.message);
      alert('Error en driver: ' + err.message);
    }
  }
  function useManualTaxi(){
    const id = el('manualTaxiId').value.trim();
    if(!id){ alert('Escribe un ID de taxi. Ejemplo: taxi-01'); return; }
    manualTaxi = { id:id, name:id, plate:'', status:'Activo' };
    updateTaxiLabel();
    setText('gpsStatus','Taxi manual listo','ok');
    log('Taxi manual seleccionado: ' + id);
  }
  function validateDriverAccess(taxi){
    if(!taxi){
      setText('accessStatus','Sin taxi','bad');
      return false;
    }
    const typed = (el('driverCode').value || '').trim();
    const required = (taxi.driver_code || '').trim();

    if(!required){
      setText('accessStatus','Taxi sin código','bad');
      alert('Este taxi todavía no tiene código de conductor en Supabase. El dueño debe asignarlo.');
      return false;
    }
    if(!typed){
      setText('accessStatus','Falta código','bad');
      alert('Escribe el código secreto asignado por el dueño.');
      return false;
    }
    if(typed !== required){
      setText('accessStatus','Código incorrecto','bad');
      alert('Código incorrecto para este taxi.');
      return false;
    }
    setText('accessStatus','Autorizado','ok');
    return true;
  }

  async function sendLocationToCloud(taxi, lat, lng, accuracy){
    const payload = {
      id: String(taxi.id),
      name: taxi.name || String(taxi.id),
      plate: taxi.plate || '',
      lat: lat,
      lng: lng,
      status: taxi.status || 'Activo',
      updated_at: new Date().toISOString()
    };
    const result = await supa.from('taxis').upsert(payload);
    if(result.error){
      setText('gpsStatus','Error nube','bad');
      log('ERROR guardando ubicación: ' + result.error.message);
      return;
    }
    setText('gpsStatus','Transmitiendo','ok');
    setText('lastSignal',new Date().toLocaleTimeString());
    setText('accuracy', accuracy ? Math.round(accuracy) + ' m' : '-');
    updateMap(lat,lng,taxi.name || taxi.id);
    log('Ubicación enviada: ' + lat.toFixed(6) + ', ' + lng.toFixed(6));
  }
  function startGPS(){
    const taxi = selectedTaxi();
    if(!taxi){ alert('Primero selecciona un taxi.'); return; }
    if(!validateDriverAccess(taxi)) return;
    if(!navigator.geolocation){ alert('Este celular/navegador no soporta GPS.'); return; }
    if(watchId !== null){ alert('El GPS ya está activo.'); return; }
    updateTaxiLabel();
    setText('gpsStatus','Pidiendo permiso...','warn');
    log('Activando GPS para: ' + (taxi.name || taxi.id));
    watchId = navigator.geolocation.watchPosition(async pos => {
      await sendLocationToCloud(taxi, pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
    }, err => {
      setText('gpsStatus','Bloqueado/Error','bad');
      log('ERROR GPS: ' + err.message);
      alert('No se pudo activar GPS: ' + err.message);
      stopGPS(false);
    }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });
  }
  function stopGPS(showAlert){
    if(showAlert === undefined) showAlert = true;
    if(watchId !== null){
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      setText('gpsStatus','Detenido','warn');
      log('GPS detenido');
      if(showAlert) alert('GPS detenido.');
    }
  }
  function boot(){
    setText('jsStatus','Activo','ok');
    log('JavaScript activo');
    if(!window.supabase){
      setText('cloudStatus','SDK no cargó','bad');
      log('ERROR: No cargó supabase-js desde CDN');
      alert('No cargó Supabase JS. Revisa internet o bloqueo de CDN.');
      return;
    }
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    initMap();
    el('btnRefresh').addEventListener('click', refreshTaxis);
    el('btnStart').addEventListener('click', startGPS);
    el('btnStop').addEventListener('click', () => stopGPS(true));
    el('btnManual').addEventListener('click', useManualTaxi);
    el('taxiSelect').addEventListener('change', () => { manualTaxi = null; updateTaxiLabel(); setText('accessStatus','Sin validar','warn'); });
    el('driverCode').addEventListener('input', () => setText('accessStatus','Sin validar','warn'));
    refreshTaxis();
  }
  window.addEventListener('beforeunload', () => stopGPS(false));
  window.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
